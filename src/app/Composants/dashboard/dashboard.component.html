<div>
  <!-- Afficher les informations de l'utilisateur connecté -->
  <h2>Utilisateur connecté: {{ currentUser?.username || 'Inconnu' }}</h2> <!-- Affichage du nom d'utilisateur ou 'Inconnu' si non défini -->
<!-- Bouton de déconnexion -->
<button (click)="logout()">Déconnexion</button>
  <!-- Liste des utilisateurs -->
  <h3>Liste des utilisateurs</h3>
  <ul>
    <li *ngFor="let user of users">
      {{ user.email }} <!-- Afficher l'email de l'utilisateur -->
      <button (click)="startChat(user.email)">Chat</button> <!-- Bouton pour démarrer une discussion -->
    </li>
  </ul>
