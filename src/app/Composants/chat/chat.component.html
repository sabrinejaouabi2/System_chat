<div class="chat-container">
  <div class="messages">
    <div *ngFor="let message of messages">
      {{ message.content }}
    </div>
  </div>

  <div class="input-area">
    <textarea [(ngModel)]="newMessage" placeholder="Écrire un message..."></textarea>
    <button (click)="sendMessage(newMessage)">Envoyer</button>
  </div>

  <div *ngIf="!isConnected" class="connection-status">Connexion perdue...</div>
</div>
